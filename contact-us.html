<form method="post">
    <div class="container">
        <div class="registration-form">
            <div class="row"><div class="col-12 mb-5"><hr class="title-line" /><h4 class="text-semibold">Support enquiry</h4></div></div>
            <div class="form">
                <div class="form-group">
                    <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">First name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtFirstName" name="txtFirstName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtLastName" name="txtLastName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email address <span class="asterisk">*</span></label>
                                <input type="email" class="form-control" id="txtEmail" name="txtEmail">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact number</label>
                                <input type="text" class="form-control" id="txtMobile" name="txtMobile" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Country <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlCountry" name="ddlCountry"><option value="">Select country</option><option value="702">Singapore</option><option value="458">Malaysia</option><option value="356">India</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Enquiry type <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlEnquiryType" name="ddlEnquiryType"><option value="">Select</option><option value="1">Programme</option><option value="2">Points</option><option value="3">Redemption</option><option value="4">Account</option><option value="5">Other</option></select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Subject <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtSubject" name="txtSubject" value="" >
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Message <span class="asterisk">*</span></label>
                                <textarea rows="4" class="form-control" id="txtMessage" name="txtMessage"></textarea>
                            </div>

                    </div>
                    <div class="row"><div class="col-12 mt-5 mb-5 text-center"><button class="btn btn-arrow btn-yellow" type="submit">Submit</button></div></div>
                </div>
            </div>
        </div>
    </div>
</form>
