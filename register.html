<form method="post">
    <div class="container">
        <div class="registration-form">
            <div class="form">
                <div class="form-group">
                    <div class="row"><div class="col-12 mb-5"><hr class="title-line"><h4 class="text-semibold">Company details</h4></div></div>
                    <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Country <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlCountry" name="ddlCountry"><option value="">Select country</option><option value="702">Singapore</option><option value="458">Malaysia</option><option value="356">India</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Company name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtCompanyName" name="txtCompanyName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Address 1 <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtCompAddress1" name="txtCompAddress1" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Address 2</label>
                                <input type="text" class="form-control" id="txtCompAddress2" name="txtCompAddress2" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">City <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtCompCity" name="txtCompCity" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">State <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlCompState" name="ddlCompState"><option value="">Select state</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Postal code <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtCompPostalCode" name="txtCompPostalCode" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Website</label>
                                <input type="text" class="form-control" id="txtCompanyWebsite" name="txtCompanyWebsite" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Business registration number <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtBusinessNumber" name="txtBusinessNumber" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Business registration document</label>
                                <input type="file" class="form-control" id="fileBusinessReg" name="fileBusinessReg">
                            </div>
                    </div>
                    <div class="row"><div class="col-12 mb-5 mt-5"><hr class="title-line"><h4 class="text-semibold">Principal contact</h4></div></div>
                    <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">First name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtMgrFirstName" name="txtMgrFirstName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtMgrLastName" name="txtMgrLastName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email address <span class="asterisk">*</span></label>
                                <input type="email" class="form-control" id="txtManagerEmail" name="txtManagerEmail">
                            </div>
                    </div>
                    <div class="row"><div class="col-12 mb-5 mt-5"><hr class="title-line"><h4 class="text-semibold">Your details</h4></div></div>
                    <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">First name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtFirstName" name="txtFirstName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last name <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtLastName" name="txtLastName" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email address <span class="asterisk">*</span></label>
                                <input type="email" class="form-control" id="txtEmailAddress" name="txtEmailAddress">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Contact number <span class="asterisk">*</span></label>
                                <input type="text" class="form-control" id="txtContactNo" name="txtContactNo" value="" >
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Designation <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlJobTitle" name="ddlJobTitle"><option value="">Select</option><option value="1">Sales manager</option><option value="2">Director</option><option value="3">Engineer</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Job level <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlJobLevel" name="ddlJobLevel"><option value="">Select</option><option value="1">Executive</option><option value="2">Manager</option><option value="3">Staff</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">How did you hear about the programme <span class="asterisk">*</span></label>
                                <select class="form-control" id="ddlReferralSource" name="ddlReferralSource"><option value="">Select</option><option value="1">Brand representative</option><option value="2">Partner referral</option><option value="3">Event</option><option value="4">Other</option></select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Referral code</label>
                                <input type="text" class="form-control" id="txtReferralCode" name="txtReferralCode" value="" >
                            </div>
                    </div>
                    <div class="row">
                        <div class="col-12 mt-5">
                            <div class="form-check">
                                <label class="checkbox-container" style="margin-left:1.5rem">
                                    I confirm that I am authorised by my company to register for the programme and I agree to the <a href="info.html" style="color:orange">Terms and conditions</a> and <a href="info.html" style="color:orange">Privacy policy</a>.
                                    <input type="checkbox" id="chkTnc"><span class="checkmark"></span>
                                </label>
                            </div>
                            <div class="form-check">
                                <label class="checkbox-container" style="margin-left:1.5rem">
                                    I agree to receive programme communications.
                                    <input type="checkbox" id="chkMarketing"><span class="checkmark"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="row"><div class="col-12 mt-5 mb-5 text-center"><button class="btn btn-arrow btn-yellow" type="submit">Submit</button></div></div>
                </div>
            </div>
        </div>
    </div>
</form>
